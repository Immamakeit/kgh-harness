# 하네스 컨피그 스키마 — 구조와 디폴트값의 단일 진실원.
# 값의 옳고 그름(모델명·effort)은 여기서 판단하지 않는다:
# validated_by: adapter 로 표시하고 adapters/<active_harness>/capabilities.yaml 에 위임한다.
version: 1

top_level:
  active_harness: { type: string, required: true, validated_by: adapter }
  defaults:       { type: map,    required: false }
  workdocs:       { type: map,    required: false }
  storage:        { type: map,    required: false }
  stages:         { type: map,    required: false }
  bootstrap:      { type: map,    required: false }
  preferences:    { type: map,    required: false }
  skills:         { type: map,    required: false }
  commit:         { type: map,    required: false }
  agent_mode:     { type: enum, values: [single, multi], default: multi, validated_by: schema }
  # 주의: top_level 스칼라 값은 구조(키 존재)만 검사된다 — validate_config.py 는
  # top_level 에 대해 필수 여부만 확인하고 enum 값 자체는 검사하지 않는다
  # (active_harness 만 어댑터 조회로 간접 검증됨).
  # single 이 아닌 값은(오타 포함) 전부 multi 로 취급한다 — 플레이북 §1, bootstrap.prompt
  # 해석 규칙(§0-1)과 동일한 안전측 기본화.

defaults:
  model:  { type: string, default: sonnet, validated_by: adapter }
  effort: { type: string, default: medium, validated_by: adapter }

workdocs:
  # 역할 3개(design·plan·report)는 워크플로 게이트(⑤ 승인 / ⑥ 확정 / ⑩ 판정)와 묶여
  # 있어 개수·의미를 바꿀 수 없다. 컨피그가 정하는 것은 **표시 이름과 하위 경로**뿐이다.
  # names 를 쓸 거면 세 역할을 전부 적어야 한다 — 둘만 적으면 나머지 하나를 무엇으로
  # 부를지 아무도 모르는 상태가 되므로 HRN-E004 로 차단한다.
  path:   { type: string, default: .harness/work }
  layout: { type: string, default: "<작업명>/<YYYY-MM-DD>" }
  names:
    # 치환자 표기는 storage.path_template 과 동일하다 — 새 문법을 만들지 않는다.
    design: { type: string, default: 설계.md }
    plan:   { type: string, default: 구현계획.md }
    report: { type: string, default: 구현후보고.md }

storage:
  enabled:       { type: bool, default: true }
  tool:          { type: enum, values: [obsidian-cli], default: obsidian-cli }
  vault_root:    { type: string, default: null, nullable: true }
  path_template: { type: string, required: false }
  # docs 키는 2026-08-26 제거됨 — 선언만 있고 읽는 곳이 0곳이었다.
  # 문서 이름은 workdocs.names 가 소유한다(같은 것을 두 곳에서 정하지 않는다).
  approval:      { type: enum, values: [auto, required], default: auto }

stages:
  known: [entry_gate, clarify, impact, design, plan, implement,
          verify, report, judgment, storage]
  keys:
    model:    { type: string, validated_by: adapter }
    effort:   { type: string, validated_by: adapter }
    skills:   { type: list, item: skill_ref }
    gate:     { type: enum, values: [required, auto, optional] }
    enabled:  { type: enum, values: ["true", "false", conditional] }
    dispatch: { type: bool }
    loop:     { type: enum, values: [auto, manual] }

bootstrap:
  # 기반 문서(PRD·CLAUDE·AGENTS) 세팅 제안. set-initial 스킬이 소유한다.
  # 하위 키 검증은 defaults·storage 와 같은 수준(구조만) 이다.
  # 주의: 이 서브스키마는 검증기가 읽지 않는다 — validate_config.py는 top_level 존재만
  # 확인하고 stages만 별도로 하위 키를 본다. prompt에 오타값을 넣어도 통과한다.
  # 해석 규칙(플레이북 §0-1): off가 아닌 값은 전부 ask로 취급 — 오타의 결과를 예측 가능하게 한다.
  prompt: { type: enum, values: [ask, off], default: ask }

preferences:
  # 선호 기반 옵션 추천. preference-options 스킬이 소유한다.
  # 하위 키 검증은 bootstrap 과 같은 수준(구조만) 이다 — 이 서브스키마도 검증기가
  # 읽지 않는다. write_to 에 오타값을 넣어도 통과한다.
  # 해석 규칙(플레이북 §1-5 원칙, 스킬 문서가 소유): project 가 **아닌** 값은
  # (부재·오타 포함) 전부 global 로 취급한다. agent_mode·bootstrap.prompt 와
  # 방향이 다른 이유는 "덜 놀라운 쪽"이 값마다 다르기 때문이다 — project 쓰기는
  # 대상 저장소 git 히스토리에 선택 이력이 섞이는 부작용이 있어, 오타가 그쪽으로
  # 넘어가는 것이 반대 방향보다 놀랍다.
  write_to: { type: enum, values: [global, project], default: global }
  # as_recommended 해석은 write_to 와 **방향이 반대다**: 명시적 `true` 가 아닌 모든
  # 값(부재·오타 포함)은 `false` 로 취급한다. 여러 질문을 한꺼번에 건너뛰는 강한
  # 동작이라, 애매하면 "멈춘다"쪽이 덜 놀랍기 때문이다. 같은 블록 안에서 두 키의
  # 안전 방향이 다른 것은 원칙이 흔들려서가 아니라 값의 성격이 다르기 때문이다
  # (플레이북 §1-5).
  as_recommended: { type: bool, default: false }

skills:
  # 프로젝트 소유 스킬의 위치. preference-options 와 같은 수준(구조만) 검증이다.
  # 기준점은 프로젝트 루트 = dirname(harness.config.yaml) — 새 관례를 만들지 않고
  # 검증기가 이미 받는 값에서 유도한다.
  # 해석 규칙(플레이북 §1-5): 값이 없거나 null 이면 **탐색하지 않는다.** 기본을
  # 'skills' 로 두면 skills/ 디렉터리를 가진 기존 설치본이 업데이트만 했는데 해석
  # 경로가 바뀌고, 이름이 겹치면 검증이 막힌다 — 켜는 것은 명시적 선택이어야 한다.
  project_path: { type: string, default: null, nullable: true }

commit:
  # 커밋 규약은 **프로젝트가 소유한다.** 검증기는 구조만 본다 — format 에 {type}·{message}
  # 치환자가 있는지, types 가 비어 있지 않은지까지다. 어떤 작업유형이 옳은지는 검사하지
  # 않는다(저장소마다 다르고, 하네스가 남의 이력에 자기 취향을 남길 이유가 없다).
  # 기본값은 하네스 현행과 같아, 지정하지 않으면 지금까지와 동일하게 동작한다.
  format: { type: string, default: "[{type}]: {message}" }
  types:  { type: list, default: [feat, fix, refactor, docs, test, chore, style] }
