# 하네스 컨피그 스키마 — 구조와 디폴트값의 단일 진실원.
# 값의 옳고 그름(모델명·effort)은 여기서 판단하지 않는다:
# validated_by: adapter 로 표시하고 adapters/<active_harness>/capabilities.yaml 에 위임한다.
version: 1

top_level:
  active_harness: { type: string, required: true, validated_by: adapter }
  defaults:       { type: map,    required: false }
  workdocs:       { type: map,    required: false }
  storage:        { type: map,    required: false }
  stages:         { type: map,    required: false }
  bootstrap:      { type: map,    required: false }
  agent_mode:     { type: enum, values: [single, multi], default: multi, validated_by: schema }
  # 주의: top_level 스칼라 값은 구조(키 존재)만 검사된다 — validate_config.py 는
  # top_level 에 대해 필수 여부만 확인하고 enum 값 자체는 검사하지 않는다
  # (active_harness 만 어댑터 조회로 간접 검증됨).
  # single 이 아닌 값은(오타 포함) 전부 multi 로 취급한다 — 플레이북 §1, bootstrap.prompt
  # 해석 규칙(§0-1)과 동일한 안전측 기본화.

defaults:
  model:  { type: string, default: sonnet, validated_by: adapter }
  effort: { type: string, default: medium, validated_by: adapter }

workdocs:
  path: { type: string, default: .harness/work }

storage:
  enabled:       { type: bool, default: true }
  tool:          { type: enum, values: [obsidian-cli], default: obsidian-cli }
  vault_root:    { type: string, default: null, nullable: true }
  path_template: { type: string, required: false }
  docs:          { type: list, default: [설계, 구현계획, 구현후보고] }
  approval:      { type: enum, values: [auto, required], default: auto }

stages:
  known: [entry_gate, clarify, impact, design, plan, implement,
          verify, report, judgment, storage]
  keys:
    model:    { type: string, validated_by: adapter }
    effort:   { type: string, validated_by: adapter }
    skills:   { type: list, item: skill_ref }
    gate:     { type: enum, values: [required, auto, optional] }
    enabled:  { type: enum, values: ["true", "false", conditional] }
    dispatch: { type: bool }
    loop:     { type: enum, values: [auto, manual] }

bootstrap:
  # 기반 문서(PRD·CLAUDE·AGENTS) 세팅 제안. set-initial 스킬이 소유한다.
  # 하위 키 검증은 defaults·storage 와 같은 수준(구조만) 이다.
  # 주의: 이 서브스키마는 검증기가 읽지 않는다 — validate_config.py는 top_level 존재만
  # 확인하고 stages만 별도로 하위 키를 본다. prompt에 오타값을 넣어도 통과한다.
  # 해석 규칙(플레이북 §0-1): off가 아닌 값은 전부 ask로 취급 — 오타의 결과를 예측 가능하게 한다.
  prompt: { type: enum, values: [ask, off], default: ask }
