# 하네스 컨피그 템플릿 — install/setup 이 대상 프로젝트 루트에 이 파일을 복사해
# harness.config.yaml 을 만든다. 설치 후에는 대상 프로젝트의 파일을 직접 수정하면 되고,
# install/update 는 이 파일로 대상 컨피그를 덮어쓰지 않는다(새 키만 안내).
#
# 값 변경은 다음 흐름 시작 시 즉시 반영된다 (런타임 read, 캐시 없음).
# 검증: <프로젝트>/.harness/install/validate-config

active_harness: claude          # claude | codex(추후) | ollama(추후)

agent_mode: multi                # single | multi(기본) — 전역 마스터 스위치.
                                  # single이면 stages.<구간>.dispatch 값은 전부 무시된다.
                                  # 주의: 이 값은 검증기가 검사하지 않는다 — single이 아닌
                                  # 값은(오타 포함) 전부 multi로 취급된다(플레이북 §1).

defaults:                        # 구간 미지정 시 상속
  model: sonnet
  effort: medium                 # Claude 어댑터의 Agent 디스패치는 현재 effort 미지원 — 플레이북 §1 참조

workdocs:
  path: .harness/work            # 작업 문서(설계·구현계획·구현후보고) 보관 위치, 프로젝트 루트 기준
  layout: "<작업명>/<YYYY-MM-DD>"   # path 아래 하위 경로 패턴 (치환자는 storage.path_template 과 동일)
  names:                           # 역할 → 파일명. 셋 다 적거나, 통째로 지우거나 (부분 지정 금지)
    design: 설계.md
    plan:   구현계획.md
    report: 구현후보고.md

storage:
  enabled: true
  tool: obsidian-cli
  vault_root: null               # Obsidian vault 절대경로. null이면 저장 건너뜀(HRN-W010) — setup이 물어서 채운다
  path_template: "wiki/프로젝트/<프로젝트>/_work/<작업명>/<YYYY-MM-DD>"
  approval: auto                 # auto = 판정 통과 시 자동 저장 | required = 저장 직전 확인

bootstrap:                       # 기반 문서 세팅 제안 (set-initial 스킬)
  prompt: ask                    # ask = PRD·CLAUDE·AGENTS 가 없으면 세션 시작 때 제안 | off = 제안 안 함
                                  # 주의: 이 값은 검증기가 검사하지 않는다 — 오타를 내면 off가
                                  # 아닌 한 전부 ask로 취급된다(플레이북 §0-1)

preferences:                     # 선호 기반 옵션 추천 (preference-options 스킬)
  write_to: global               # global(기본) = ~/.claude/harness/preferences.yaml 에 기록
                                  # project = <프로젝트>/.harness/preferences.yaml 에 기록
                                  # 주의: 이 값은 검증기가 검사하지 않는다 — project 가 아닌
                                  # 값은(부재·오타 포함) 전부 global 로 취급된다
                                  # (스킬 문서 "쓰기 위치" 절, 플레이북 §1-5)
  as_recommended: false          # true = 번호 선택형 질문을 추천대로 자동 채택하고
                                  # 무엇을 왜 골랐는지 표로 남긴다
                                  # 제외 3개(자동 채택 안 함): ⑤ 설계 승인 · ⑩ 사용자 판정 ·
                                  # 선호 프로필 삭제 확인 — 되돌릴 길이 없는 동작이라서
                                  # 주의: 이 값도 검증기가 검사하지 않는다 — true 가 아닌
                                  # 값은(부재·오타 포함) 전부 false 로 취급된다(write_to 와 반대)

commit:                          # 커밋 규약 — 프로젝트가 소유한다
  format: "[{type}]: {message}"  # 기본 = 하네스 현행. 예) "{type}: {message}" 면 feat: 로그인 추가
  types: [feat, fix, refactor, docs, test, chore, style]
                                 # 검증기는 구조만 본다 — 치환자 실존 + types 비어 있지 않음.
                                 # 어떤 유형이 옳은지는 검사하지 않는다(저장소마다 다르다)

stages:
  entry_gate:                    # ① 입구 판단 게이트 — 판단형 요청일 때만
    enabled: conditional
    skills: [cost-bottleneck-check]
  clarify:                       # ②③ 요구·의도 파악
    skills: [superpowers:brainstorming]
  impact:                        # ④ 영향도 분석
    dispatch: true
    skills: []
  design:                        # ⑤ 설계
    model: opus
    effort: high
    skills: [design-doc]
    gate: required               # 명시적 승인 필수
  plan:                          # ⑥ 구현 계획
    skills: [scope-splitter, plan-doc, superpowers:writing-plans]
    gate: auto                   # auto = 확정 후 자동 진행 | optional = 사용자 확인
  implement:                     # ⑦ 구현
    model: sonnet
    dispatch: true
    skills: [superpowers:test-driven-development, interactive-script]
  verify:                        # ⑧ 검증
    dispatch: true
    skills: [superpowers:requesting-code-review]
    loop: auto                   # 실패 시 자동 루프 (계획서 기록 → 구현 재진입)
  report:                        # ⑨ 보고
    skills: [report-doc]
  judgment:                      # ⑩ 사용자 판정
    gate: required               # "통과/실패"만 입력
  storage:                       # ⑪ 산출물 저장
    skills: [obsidian-cli]
